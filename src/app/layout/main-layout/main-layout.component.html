<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed()">

  <!-- ===== SIDEBAR ===== -->
  <aside
    class="sidebar"
    [class.open]="sidebarOpen()"
    [class.collapsed]="sidebarCollapsed()">

    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-copy">
        <strong>SIGO</strong>
        <span>Gestión Operativa</span>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" title="Dashboard" (click)="closeSidebar()">
        
        <span class="nav-label">Dashboard</span>
      </a>

      <a routerLink="/registrar-asistencia" routerLinkActive="active" title="Registrar asistencia" (click)="closeSidebar()">
        
        <span class="nav-label">Registrar asistencia</span>
      </a>

      <a routerLink="/historial" routerLinkActive="active" title="Historial" (click)="closeSidebar()">
        
        <span class="nav-label">Historial de asistencias</span>
      </a>

      <a routerLink="/nuevo-relevo" routerLinkActive="active" title="Nuevo relevo" (click)="closeSidebar()">
        
        <span class="nav-label">Nuevo relevo</span>
      </a>

      <a routerLink="/historial-relevos" routerLinkActive="active" title="Historial de relevos" (click)="closeSidebar()">
        
        <span class="nav-label">Historial de relevos</span>
      </a>
    </nav>

    
  </aside>

  <!-- ===== OVERLAY (móvil) ===== -->
  @if (sidebarOpen()) {
    <button
      class="overlay"
      type="button"
      aria-label="Cerrar menú"
      (click)="closeSidebar()">
    </button>
  }

  <!-- ===== CONTENIDO ===== -->
  <section class="content">

    <header class="topbar">
      <button
        class="menu-btn"
        type="button"
        [attr.aria-label]="sidebarCollapsed() ? 'Mostrar menú lateral' : 'Ocultar menú lateral'"
        [attr.aria-expanded]="!sidebarCollapsed()"
        (click)="toggleSidebar()">
        ☰
      </button>

      <div class="topbar-title">
        <span>Módulo de asistencia</span>
        <small>Control operativo en tiempo real</small>
      </div>

      <div class="user-chip">
        <div class="avatar">CO</div>
        <div>
          <strong>Controlador</strong>
          <span>Lima Expresa</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <router-outlet />
    </main>

    <footer>
      © {{ currentYear }} SIGO · Sistema Integral de Gestión Operativa
    </footer>

  </section>

</div>
